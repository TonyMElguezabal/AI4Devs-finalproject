# Vid4You API contract — reset for this product (start-video-project, JOS-134,
# Decision 9). The previous version of this file described an unrelated
# inherited application (an LTI recruitment platform) end to end and has been
# fully removed.
#
# GENERATED, not hand-written: this file is produced from the Fastify + Zod
# route schemas the backend actually serves (`GET /docs/json` against a
# running instance), per `docs/backend-standards.md` § API and OpenAPI
# Conventions — "OpenAPI is generated... never hand-written and never allowed
# to drift from the actual validators." Task 5.3 confirmed this by generating
# directly from the real running server, not transcribing intent.
#
# Scope note: this story (JOS-134) only implements `POST /sessions` and
# `GET /languages`. The other paths below (`GET /sessions/{sessionId}`,
# pause/continue, scene retry/correct, downloads, the provider-callback
# simulation, the SSE `/events` stream) already exist because they were
# promoted from the `define-backend-stack` (JOS-179) skeleton this story
# extends rather than replaces — they belong to their own future stories
# (consult-session/JOS-135, US-20/US-21, US-25/US-26, US-31/US-32,
# define-live-updates/JOS-183) and are documented here only because they are
# real, not because this change built them. Regenerate this file (same
# command) whenever a route changes, rather than hand-editing it out of sync.
#
openapi: 3.0.3
info:
  title: Vid4You API
  version: 0.0.0
  description: Local, single-user API for turning a script into a narrated MP4
    (Vid4You). Generated from the Fastify + Zod route schemas in
    backend/src/routes.ts (docs/backend-standards.md, API and OpenAPI
    Conventions) - never hand-written, to avoid drifting from the real
    validators.
components:
  schemas: {}
paths:
  /health:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
                additionalProperties: false
  /languages:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                    label:
                      type: string
                  required:
                    - code
                    - label
                  additionalProperties: false
  /sessions:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Immutable once the session is registered (PRD §4.2).
                script:
                  type: string
                  description: Stored exactly as submitted and immutable from registration onward,
                    in every state (PRD §4.2, D10). No operation modifies it.
                language:
                  type: string
                  enum:
                    - en
                    - es
                  description: Immutable once the session is registered (PRD §4.1, §4.2).
              required:
                - title
                - script
                - language
              additionalProperties: false
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - session
                      sessionId:
                        type: string
                      title:
                        type: string
                        description: Immutable once the session is registered (PRD §4.2).
                      script:
                        type: string
                        description: The script exactly as submitted; immutable from registration
                          onward, in every state (PRD §4.2, D10). No operation
                          modifies it.
                      language:
                        type: string
                        description: Immutable once the session is registered (PRD §4.1, §4.2).
                      state:
                        type: string
                      paused:
                        type: boolean
                      held:
                        type: array
                        description: Stages with held work; empty when not paused.
                        items:
                          type: object
                          properties:
                            stage:
                              type: string
                            count:
                              type: number
                          required:
                            - stage
                            - count
                      failedPhase:
                        type: string
                      failedSceneIndexes:
                        type: array
                        items:
                          type: integer
                        description: 'PRD §8.1: the indexes of the failed scenes, ascending. Present
                          only when failedPhase is "scenes". Derived and
                          read-only.'
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                    required:
                      - type
                      - sessionId
                      - title
                      - script
                      - language
                      - state
                      - paused
                      - held
                      - createdAt
                      - updatedAt
                    additionalProperties: false
                  scenes:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                            - scene
                        sessionId:
                          type: string
                        sceneId:
                          type: string
                        index:
                          type: number
                        state:
                          type: string
                        affectedStage:
                          type: string
                          enum:
                            - image
                            - video
                        errorCause:
                          type: string
                          nullable: true
                        provider:
                          type: string
                        attempts:
                          type: number
                        result:
                          type: object
                          properties:
                            imageUrl:
                              type: string
                            videoUrl:
                              type: string
                          additionalProperties: false
                        instruction:
                          type: string
                        prompt:
                          type: string
                          description: "PRD §3 PROMPT: the fragment of the script this chunk narrates.
                            Immutable once the chunk is established (PRD §6)."
                        imageInstruction:
                          type: string
                          description: "PRD §3 IMAGE: the instruction to generate the chunk's image."
                        videoInstruction:
                          type: string
                          description: "PRD §3 VIDEO: the instruction to animate the chunk's image."
                        narrationInterval:
                          type: object
                          properties:
                            startSeconds:
                              type: number
                            endSeconds:
                              type: number
                          required:
                            - startSeconds
                            - endSeconds
                          additionalProperties: false
                          description: "PRD §3 and §7.3: the part of the voice-over this chunk narrates,
                            in seconds. The intervals of a session's chunks are
                            contiguous and cover the voice-over from 0 to its
                            full duration. Read-only and immutable once the
                            chunk is established; absent for a scene created
                            without a decomposition."
                        requestedDurationSeconds:
                          type: number
                          description: "PRD §7.2: the video provider's admitted clip duration requested
                            for this chunk, chosen as the one needing the
                            smallest speed change to match its narrated
                            interval. Read-only and immutable once the chunk is
                            established; absent for a scene created without a
                            decomposition."
                        durationWarning:
                          type: string
                          enum:
                            - exceeds-maximum
                          description: "PRD §6.1.1: set when the chunk's narrated interval is longer than
                            the provider's largest admitted duration (an
                            unsplittable sentence), so the requested duration
                            had to be capped at that maximum. Not a failure.
                            Read-only and immutable once the chunk is
                            established."
                        speedFactor:
                          type: number
                          description: "PRD §7.2/AC23: the speed-adjustment factor the requested duration
                            implies (`max(requested/narrated,
                            narrated/requested)`, always >= 1). Read-only and
                            immutable once the chunk is established; absent for
                            a scene created without a decomposition."
                        speedFactorWarning:
                          type: string
                          enum:
                            - exceeds-limit
                          description: "PRD §7.2: set when the speed-adjustment factor exceeds the
                            hardcoded acceptable limit. Not a failure, and
                            independent of durationWarning. Read-only and
                            immutable once the chunk is established."
                        held:
                          type: boolean
                          description: True while the session is paused and this scene has pending work waiting to be launched.
                        updatedAt:
                          type: string
                      required:
                        - type
                        - sessionId
                        - sceneId
                        - index
                        - state
                        - updatedAt
                      additionalProperties: false
                required:
                  - session
                  - scenes
                additionalProperties: false
