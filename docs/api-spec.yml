                            heldCount:
                              type: integer
                              description: Work units a pause is holding for this phase; 0 when not paused.
                            stages:
                              type: array
                              items:
                                type: object
                                properties:
                                  stage:
                                    type: string
                                    enum:
                                      - image
                                      - video
                                      - voice-over
                                      - timestamps
                                      - instructions
                                      - assembly
                                  provider:
                                    type: object
                                    properties:
                                      name:
