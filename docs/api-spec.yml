                            for this chunk, chosen as the one needing the
                            smallest speed change to match its narrated
                            interval. Read-only and immutable once the chunk is
                            established; absent for a scene created without a
                            decomposition."
                        durationWarning:
                          type: string
                          enum:
                            - exceeds-maximum
                          description: "PRD §6.1.1: set when the chunk's narrated interval is longer than
                            the provider's largest admitted duration (an
                            unsplittable sentence), so the requested duration
                            had to be capped at that maximum. Not a failure.
