                      phases:
                        type: array
                        items:
                          type: object
                          properties:
                            phase:
                              type: string
                              enum:
                                - voice-over
                                - decomposition
                                - scenes
                                - assembly
                            status:
                              type: string
                              enum:
                                - pending
                                - in-progress
                                - complete
                                - failed
                              description: "PRD §8.1, §8.3: derived from the session state on every read,
