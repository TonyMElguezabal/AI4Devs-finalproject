  /admin/settings/reference-image:
    put:
      security:
        - administratorPassword: []
      description: Stores the optional reference image (raw bytes, replacing any earlier one). The bytes must match the
        declared type's magic numbers. Sessions created afterwards copy it and send it to the image provider with every scene (PRD §11.5).
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The settings, with the stored image's content type and size.
          content:
            application/json:
              schema:
                type: object
                properties:
                  visualStylePrompt:
                    type: string
                  referenceImage:
                    type: object
                    properties:
                      contentType:
                        type: string
                      sizeBytes:
                        type: integer
                      updatedAt:
                        type: string
                    required:
                      - contentType
                      - sizeBytes
                      - updatedAt
                    additionalProperties: false
                    nullable: true
                  updatedAt:
                    type: string
                required:
                  - visualStylePrompt
                  - referenceImage
                  - updatedAt
                additionalProperties: false
        "400":
          description: Another content type (or none), or bytes that do not match the declared type. The previous image is kept.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
        "413":
          description: The image is larger than 5 MB. The previous image is kept.
        "401":
          description: The Administrator password is missing, wrong or not configured.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    type: string
                    enum:
                      - not-configured
                      - password-required
                      - wrong-password
                required:
                  - ok
                  - reason
                additionalProperties: false
    get:
      security:
        - administratorPassword: []
      description: Streams the stored image with its content type.
      responses:
        "200":
          description: The image bytes.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: No reference image is stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    type: string
                required:
                  - ok
                  - reason
                additionalProperties: false
        "401":
          description: The Administrator password is missing, wrong or not configured.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  reason:
                    type: string
                    enum:
                      - not-configured
                      - password-required
                      - wrong-password
                required:
                  - ok
                  - reason
                additionalProperties: false
    delete:
      security:
        - administratorPassword: []
      description: Removes the stored image and its file. Answers 204 also when there is none.
      responses:
        "204":
          description: Removed (or nothing to remove).
