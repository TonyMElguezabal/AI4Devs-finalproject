                          type: string
                          description: "PRD §3 IMAGE: the instruction to generate the chunk's image."
                        videoInstruction:
                          type: string
                          description: "PRD §3 VIDEO: the instruction to animate the chunk's image."
                        narrationInterval:
                          type: object
                          properties:
                            startSeconds:
                              type: number
                            endSeconds:
                              type: number
                          required:
                            - startSeconds
                            - endSeconds
                          additionalProperties: false
                          description: "PRD §3 and §7.3: the part of the voice-over this chunk narrates,
                            in seconds. The intervals of a session's chunks are
                            contiguous and cover the voice-over from 0 to its
                            full duration. Read-only and immutable once the
                            chunk is established; absent for a scene created
                            without a decomposition."
                        requestedDurationSeconds:
                          type: number
                          description: "PRD §7.2: the video provider's admitted clip duration requested
                            for this chunk, chosen as the one needing the
                            smallest speed change to match its narrated
                            interval. Read-only and immutable once the chunk is
                            established; absent for a scene created without a
                            decomposition."
                        durationWarning:
                          type: string
                          enum:
                            - exceeds-maximum
                          description: "PRD §6.1.1: set when the chunk's narrated interval is longer than
                            the provider's largest admitted duration (an
                            unsplittable sentence), so the requested duration
                            had to be capped at that maximum. Not a failure.
                            Read-only and immutable once the chunk is
                            established."
                        speedFactor:
                          type: number
                          description: "PRD §7.2/AC23: the speed-adjustment factor the requested duration
                            implies (`max(requested/narrated,
                            narrated/requested)`, always >= 1). Read-only and
                            immutable once the chunk is established; absent for
                            a scene created without a decomposition."
                        speedFactorWarning:
                          type: string
                          enum:
                            - exceeds-limit
                          description: "PRD §7.2: set when the speed-adjustment factor exceeds the
                            hardcoded acceptable limit. Not a failure, and
                            independent of durationWarning. Read-only and
                            immutable once the chunk is established."
                        held:
                          type: boolean
                          description: True while the session is paused and this scene has pending work
                            waiting to be launched.
                        updatedAt:
                          type: string
