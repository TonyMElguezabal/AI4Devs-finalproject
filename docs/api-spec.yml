                                      model:
                                        type: string
                                        nullable: true
                                    required:
                                      - name
                                      - model
                                    additionalProperties: false
                                  attempts:
                                    type: integer
                                    minimum: 1
                                    description: Attempts recorded for this stage across every retry cycle,
