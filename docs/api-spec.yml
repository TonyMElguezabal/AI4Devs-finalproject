# Vid4You API contract — reset for this product (start-video-project, JOS-134,
# Decision 9). The previous version of this file described an unrelated
# inherited application (an LTI recruitment platform) end to end and has been
# fully removed.
#
# GENERATED, not hand-written: this file is produced from the Fastify + Zod
# route schemas the backend actually serves (`GET /docs/json` against a
# running instance), per `docs/backend-standards.md` § API and OpenAPI
# Conventions — "OpenAPI is generated... never hand-written and never allowed
# to drift from the actual validators." Task 5.3 confirmed this by generating
# directly from the real running server, not transcribing intent.
#
# Scope note: start-video-project (JOS-134) originally implemented only `POST /sessions` and
# `GET /languages`. The other paths below (`GET /sessions/{sessionId}`,
# pause/continue, scene retry/correct, downloads, the provider-callback
# simulation, the SSE `/events` stream) already exist because they were
# promoted from the `define-backend-stack` (JOS-179) skeleton this story
# extended rather than replaced. Their owning stories include consult-session
# (JOS-135), pause/continue (US-20/US-21), scene recovery (JOS-157/JOS-158),
# downloads (US-31/US-32), and define-live-updates (JOS-183). Regenerate this
# file (same
# command) whenever a route changes, rather than hand-editing it out of sync.
#
# JOS-156 (retry-decomposition) — 2026-10-05: regenerated; the only change is the new
# `POST /sessions/{sessionId}/decomposition/retry` (200 `{ ok, held }`, 404, 409
# `{ ok, reason }`; a body field answers 400 from the strict empty body).
#
# JOS-158 (retry-or-correct-clip): the existing scene retry/correct routes now
# dispatch by the persisted failed stage. A failed video stage retries the clip
# or corrects only VIDEO; the completed image and provider binding are retained.
# Request/response schemas are unchanged; the route's 404/409 reason shape is
# unchanged and state conflicts use the same generic reason field.
#
# JOS-136 (generate-voice-over) - 2026-10-04: regenerated from the running
# server. The session read (`GET /sessions/{sessionId}` and the SSE session
# event) gained two optional objects: `voiceOver` ({ provider, durationSeconds,
# nativeTimestampsAvailable, completedAt }, present once the narration exists)
# and `failure` ({ phase, cause, retryable, occurredAt }, present while the
# session is failed in a phase that records its failure). No new path: the MP3
# is never offered for download (PRD 12.3). The regeneration also records
# `additionalProperties: false` on the `held` items, which the validators
# already enforced, and re-folds two long descriptions.
#
# JOS-184 (bounded-retry-policy) - 2026-10-04: the session `failure` object
# gained `manualRetryAvailable`, `cycle` and `attemptsInCycle` (all required).
# No new path. A transient failure with budget left no longer produces a
# `failure` at all: the session stays in progress while retries are made.
# JOS-168 (view-progress-by-phase) — 2026-10-04: regenerated. The new field is
# `session.phases` (four entries in pipeline order, each with `status`,
# `heldCount` and, on a failed voice-over, decomposition or assembly entry, a
# `failure` of `cause` and `retryable`); it is on the create and read
# responses and the live snapshot. Regenerating also normalized wording the
# generator now emits differently (line wrapping, the `finalVideoUrl` property
# position and description, `additionalProperties: false` on `held` items); no
# other field or type changed.
#
# JOS-166 (see-provider-and-attempts) - 2026-10-05: regenerated. Two changes:
# each scene gained `stages` (an object with optional `image` and `video`, each
# a `stage`, a `provider` of `name` and `model`, and `attempts`) and lost its
# top-level `provider` and `attempts`, which described only the image stage and
# were reset when the clip started; and each `session.phases` entry gained
# `stages` (the session-level stages that have run, same shape, required). Every
# diagnostic object is closed (`additionalProperties: false`): nothing else of an
# attempt record can reach the page. No new path; one long description is folded
# differently by the generator.
#
# JOS-159 (retry-final-assembly) — 2026-10-10: regenerated; the only change is the new
# `POST /sessions/{sessionId}/assembly/retry` (200 `{ ok, held }`, 404, 409
# `{ ok, reason }`; a body field answers 400 from the strict empty body — the exact
# same shape as JOS-156's decomposition retry route). The `assembly` entry in
# `session.failure.phase` and `session.phases[].phase` was already a valid enum
# value from JOS-168/184; this change is the first to actually produce it.
#
openapi: 3.0.3
info:
  title: Vid4You API
  version: 0.0.0
  description: Local, single-user API for turning a script into a narrated MP4
    (Vid4You). Generated from the Fastify + Zod route schemas in
    backend/src/routes.ts (docs/backend-standards.md, API and OpenAPI
    Conventions) - never hand-written, to avoid drifting from the real
    validators.
components:
  schemas: {}
paths:
  /health:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
                additionalProperties: false
  /languages:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                    label:
                      type: string
                  required:
                    - code
                    - label
                  additionalProperties: false
  /sessions:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Immutable once the session is registered (PRD §4.2).
                script:
                  type: string
                  description: Stored exactly as submitted and immutable from registration onward,
                    in every state (PRD §4.2, D10). No operation modifies it.
                language:
                  type: string
                  enum:
                    - en
                    - es
                  description: Immutable once the session is registered (PRD §4.1, §4.2).
              required:
                - title
                - script
                - language
              additionalProperties: false
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - session
                      sessionId:
                        type: string
                      title:
                        type: string
                        description: Immutable once the session is registered (PRD §4.2).
                      script:
                        type: string
                        description: The script exactly as submitted; immutable from registration
                          onward, in every state (PRD §4.2, D10). No operation
                          modifies it.
                      language:
                        type: string
                        description: Immutable once the session is registered (PRD §4.1, §4.2).
                      state:
                        type: string
                      paused:
                        type: boolean
                      held:
                        type: array
                        items:
                          type: object
                          properties:
                            stage:
                              type: string
                            count:
                              type: number
                          required:
                            - stage
                            - count
                          additionalProperties: false
                        description: Stages with held work; empty when not paused.
                      running:
                        type: array
                        items:
                          type: object
                          properties:
                            stage:
                              type: string
                            count:
                              type: number
                          required:
                            - stage
                            - count
                          additionalProperties: false
                        description: Stages with work actually in flight, computed whether or not
                          the session is paused (JOS-153).
                      failedPhase:
                        type: string
                      failedSceneIndexes:
                        type: array
                        items:
                          type: integer
                        description: 'PRD §8.1: the indexes of the failed scenes, ascending. Present
                          only when failedPhase is "scenes". Derived and
                          read-only.'
                      voiceOver:
                        type: object
                        properties:
                          provider:
                            type: string
                          durationSeconds:
                            type: number
                          nativeTimestampsAvailable:
                            type: boolean
                          completedAt:
                            type: string
                        required:
                          - provider
                          - durationSeconds
                          - nativeTimestampsAvailable
                          - completedAt
                        additionalProperties: false
                        description: Present once the narration exists (PRD §5 step 2). Derived and
                          read-only; the MP3 itself is never offered for
                          download (PRD §12.3).
                      failure:
                        type: object
                        properties:
                          phase:
                            type: string
                          cause:
                            type: string
                          retryable:
                            type: boolean
                          manualRetryAvailable:
                            type: boolean
                            description: Whether the User can start a new cycle of up to four attempts. True
                              only for a retryable failure whose cycle is
                              exhausted.
                          cycle:
                            type: integer
                            minimum: 1
                            description: The cycle that ended in this failure, from 1.
                          attemptsInCycle:
                            type: integer
                            minimum: 1
                            maximum: 4
                            description: Attempts the cycle held when it failed.
                          occurredAt:
                            type: string
                        required:
                          - phase
                          - cause
                          - retryable
                          - manualRetryAvailable
                          - cycle
                          - attemptsInCycle
                          - occurredAt
                        additionalProperties: false
                        description: Present while the session is failed in a phase that records its
