                                - attempts
                              additionalProperties: false
                            video:
                              type: object
                              properties:
                                stage:
                                  type: string
                                  enum:
                                    - image
                                    - video
                                    - voice-over
                                    - timestamps
                                    - instructions
                                    - assembly
                                provider:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                    model:
                                      type: string
                                      nullable: true
                                  required:
                                    - name
                                    - model
                                  additionalProperties: false
                                attempts:
                                  type: integer
                                  minimum: 1
                                  description: Attempts recorded for this stage across every retry cycle,
                                    including one still in flight.
                              required:
                                - stage
                                - provider
                                - attempts
