# Vid4You API contract — reset for this product (start-video-project, JOS-134,
# Decision 9). The previous version of this file described an unrelated
# inherited application (an LTI recruitment platform) end to end and has been
# fully removed.
#
# GENERATED, not hand-written: this file is produced from the Fastify + Zod
# route schemas the backend actually serves (`GET /docs/json` against a
# running instance), per `docs/backend-standards.md` § API and OpenAPI
# Conventions — "OpenAPI is generated... never hand-written and never allowed
# to drift from the actual validators." Task 5.3 confirmed this by generating
# directly from the real running server, not transcribing intent.
#
# Scope note: start-video-project (JOS-134) originally implemented only `POST /sessions` and
# `GET /languages`. The other paths below (`GET /sessions/{sessionId}`,
# pause/continue, scene retry/correct, downloads, the provider-callback
# simulation, the SSE `/events` stream) already exist because they were
# promoted from the `define-backend-stack` (JOS-179) skeleton this story
# extended rather than replaced. Their owning stories include consult-session
# (JOS-135), pause/continue (US-20/US-21), scene recovery (JOS-157/JOS-158),
# downloads (US-31/US-32), and define-live-updates (JOS-183). Regenerate this
# file (same
# command) whenever a route changes, rather than hand-editing it out of sync.
#
# JOS-174 (configure-providers-and-parameters) - 2026-10-19: no new path. The `language`
# request field of `POST /sessions` is validated against the configured list of supported
# languages (the `languages` setting, `docs/development_guide.md` "Settings files"); the
# enum below is the shipped default, English and Spanish. `GET /languages` returns the
# configured list. A structural comparison with the generated document found only this
# description, plus the hand-written 422/503 response descriptions of JOS-187.
#
# JOS-156 (retry-decomposition) — 2026-10-05: regenerated; the only change is the new
# `POST /sessions/{sessionId}/decomposition/retry` (200 `{ ok, held }`, 404, 409
# `{ ok, reason }`; a body field answers 400 from the strict empty body).
#
# JOS-155 (retry-voice-over) — 2026-10-19: the new
# `POST /sessions/{sessionId}/voice-over/retry` (200 `{ ok, held }`, 404, 409
# `{ ok, reason }` with reason one of `not-failed-in-voice-over`,
# `narration-complete`, `not-retryable`, `retry-already-pending`; a body field
# answers 400 from the strict empty body). The block was taken from the running
# server's generated output; the rest of the file is unchanged.
#
# JOS-158 (retry-or-correct-clip): the existing scene retry/correct routes now
# dispatch by the persisted failed stage. A failed video stage retries the clip
# or corrects only VIDEO; the completed image and provider binding are retained.
# Request/response schemas are unchanged; the route's 404/409 reason shape is
# unchanged and state conflicts use the same generic reason field.
#
# JOS-136 (generate-voice-over) - 2026-10-04: regenerated from the running
# server. The session read (`GET /sessions/{sessionId}` and the SSE session
# event) gained two optional objects: `voiceOver` ({ provider, durationSeconds,
# nativeTimestampsAvailable, completedAt }, present once the narration exists)
# and `failure` ({ phase, cause, retryable, occurredAt }, present while the
# session is failed in a phase that records its failure). No new path: the MP3
# is never offered for download (PRD 12.3). The regeneration also records
# `additionalProperties: false` on the `held` items, which the validators
# already enforced, and re-folds two long descriptions.
#
# JOS-184 (bounded-retry-policy) - 2026-10-04: the session `failure` object
# gained `manualRetryAvailable`, `cycle` and `attemptsInCycle` (all required).
# No new path. A transient failure with budget left no longer produces a
# `failure` at all: the session stays in progress while retries are made.
# JOS-168 (view-progress-by-phase) — 2026-10-04: regenerated. The new field is
# `session.phases` (four entries in pipeline order, each with `status`,
# `heldCount` and, on a failed voice-over, decomposition or assembly entry, a
# `failure` of `cause` and `retryable`); it is on the create and read
# responses and the live snapshot. Regenerating also normalized wording the
# generator now emits differently (line wrapping, the `finalVideoUrl` property
# position and description, `additionalProperties: false` on `held` items); no
# other field or type changed.
#
# JOS-166 (see-provider-and-attempts) - 2026-10-05: regenerated. Two changes:
# each scene gained `stages` (an object with optional `image` and `video`, each
# a `stage`, a `provider` of `name` and `model`, and `attempts`) and lost its
# top-level `provider` and `attempts`, which described only the image stage and
# were reset when the clip started; and each `session.phases` entry gained
# `stages` (the session-level stages that have run, same shape, required). Every
# diagnostic object is closed (`additionalProperties: false`): nothing else of an
# attempt record can reach the page. No new path; one long description is folded
# differently by the generator.
#
# JOS-159 (retry-final-assembly) — 2026-10-10: regenerated; the only change is the new
# `POST /sessions/{sessionId}/assembly/retry` (200 `{ ok, held }`, 404, 409
# `{ ok, reason }`; a body field answers 400 from the strict empty body — the exact
# same shape as JOS-156's decomposition retry route). The `assembly` entry in
# `session.failure.phase` and `session.phases[].phase` was already a valid enum
# value from JOS-168/184; this change is the first to actually produce it.
#
# JOS-163 (download-scene-results) — 2026-10-10: regenerated. The scene download
# route's 200 response is now the binary file itself (`image/png`, `image/jpeg`
# or `video/mp4` — rendered the same way z.any() already renders the
# final-video download's 200, a tool quirk, not a new shape) instead of a
# `text/plain` stub string; it no longer requires `chunk-complete`. Each scene
# gained an optional `downloads` object (`imageUrl`/`clipUrl`, each present
# only when that file actually exists), on the session read and the SSE scene
# event. No field for the voice-over, timestamps or generated texts exists
# anywhere (PRD §12.3) — `kind` stays `image | video`.
#
# JOS-164 (download-final-video) — 2026-10-10: regenerated. Corrects a wrong
# contract: the final-video download's 200 was documented as `application/json`
# (a `z.any()` response always resolves that way in `fastify-type-provider-zod`)
# while the server has always sent `video/mp4` bytes. Now documented as
# `content: video/mp4` with a binary schema, via a route-level
# `config.swaggerTransform` override (`binaryFileSwaggerTransform` in
# `routes.ts`) that replaces only that one route's 200 entry; every other
# route, including the scene download route JOS-163 added (still `z.any()`,
# so still documented as `application/json` despite sending binary bytes, the
# same gap this change closes only for the final-video route), is unaffected.
# No behaviour change: the route, its handler, headers and status codes are
# exactly as before.
#
# JOS-190 (adjust-scene-pause) — 2026-10-15: regenerated. Two new paths:
# `POST /sessions/{sessionId}/scenes/{sceneId}/pause` (body `{ seconds }`; 200 the
# updated scene, 404, 409 `{ ok, reason }`, 422 `{ ok, reason }` with a sentence naming
# the scene's range) and `POST /sessions/{sessionId}/final-video/rebuild` (202
# `{ ok, held }`, 404, 409). New read fields: `session.finalVideo` (`version`,
# `pendingPauseEdits`, optional `rebuildFailure`) and `scene.pause` (`originalSeconds`,
# `seconds`, `minSeconds`, `maxSeconds`, `limitedBySpeedFactor`), both present only once a
# final video exists. Nothing else changed. It is a POST, not a PUT, because the API has
# no PUT, PATCH or DELETE by design (content lock, AC1). The 422/503 descriptions of
# `POST /sessions` that JOS-187 wrote by hand are kept as they were.
# add-observability-telemetry (JOS-199): added GET and PUT /telemetry/consent (the three consent flags and
# `answered`; strict body, 400 on a missing or non-boolean key) and GET /app/update (`{ available: false }` or
# `{ available: true, tag, url }`). PUT is allowed here because consent is a setting, not session content;
# the content-lock rule (AC1) is about sessions. Nothing else changed.
#
# JOS-173 (protect-admin-with-password) - 2026-10-19: new `GET /admin/access` (200
# `{ configured: true, granted: true }`; 401 `{ ok: false, reason }` with reason
# `not-configured`, `password-required` or `wrong-password`) and the
# `administratorPassword` HTTP bearer security scheme (`Authorization: Bearer <password>`).
# Every operation under `/admin/` is marked with that scheme by the OpenAPI transform in
# `server.ts`, so a later Administrator route is documented as protected with no code of
# its own. A structural comparison with the generated document found only these additions,
# plus the hand-written 422/503 response descriptions of JOS-187.
# JOS-171 (change-active-provider-from-admin) - 2026-10-21: new `GET /admin/providers` (200 `{ providers }`, one view per stage:
# `stage`, `activeProviderId`, `activeLabel`, `source` settings|admin, `selectable`, `orphanedChoice`) and
# `PUT /admin/providers/{stage}` (body `{ providerId }`; 200 the stage's view; 400 `{ ok: false, reason: 'not-selectable',
# selectable }` or the validation error; 401 as `/admin/access`). Both are behind the Administrator password. PUT is allowed
# here because the active provider is an app-level setting, not session content (content lock, AC1).
# JOS-218 (manage-providers-from-admin) - 2026-10-21: new `GET /admin/provider-types` (the adapter types of each stage with the field
# descriptions of their parameters), `GET` and `POST /admin/provider-profiles` (the provider profiles: `stage`, `adapterType`, `label`,
# `parameters`, `keyStatus` stored|environment|missing, `keyHint`, `usable`, `problems`, `active`, `retired`; 201 and 400 `{ ok: false,
# problems }`) and `PUT` and `DELETE /admin/provider-profiles/{id}` (200; 400 problems; 404; DELETE answers `{ result: removed|retired }`
# or 409 `{ reason: active, stage }`). `PUT /admin/providers/{stage}` (JOS-171) also answers 409 `not-usable` with the problems. No
# response carries an API key. The routes are behind the Administrator password; PUT, POST and DELETE are allowed here because
# providers are app-level settings, not session content (content lock, AC1).
# JOS-226 (add-provider-price-per-unit) - 2026-10-23: no new route. The `parameters` of a provider profile (POST and PUT
# `/admin/provider-profiles`, and the profile returned by GET) take two optional keys together: `pricePerUnit` (a finite number, zero or
# greater; zero is a price) and `priceCurrency` (a three-letter ISO 4217 code, returned upper-case). Both or neither; a profile with neither is
# unpriced. A violation is a 400 with a problem on `pricePerUnit` or `priceCurrency`. Example: `{ "model": "fal-ai/flux/dev",
# "pricePerUnit": 0.04, "priceCurrency": "USD" }`. `GET /admin/provider-types` lists both as non-required fields at the end of every adapter
# type, the price labelled with the stage's unit ("Price per voice character | audio second | request | image | clip second").
# JOS-220 (test-provider-connection) - 2026-10-26: new `POST /admin/provider-profiles/{id}/test` (body `{ acceptCharge? }`; 200 `{ outcome:
# connected|key-rejected|not-found|unreachable|unexpected|no-key, covers, httpStatus? }`, a closed object that never carries a key or the vendor's
# answer; 401 as `/admin/access`; 404; 409 `{ reason: charge-not-accepted }` when the check is charged and `acceptCharge` is not true). It sends
# one request to the profile's vendor with the stored key and writes nothing. `GET /admin/provider-types` adds `connectionCheck: { charged, covers }`
# to every type. Allowed here because it changes no session content (content lock, AC1).
# JOS-172 (move-failed-stage-to-active-provider) - 2026-10-22: new `GET /admin/failed-stages` (the failed stages bound to a provider other than
# the active one: `sessionId`, `sessionTitle`, `stage`, `sceneId`, `sceneNumber`, both providers' ids and labels, `cause`) and
# `POST /admin/failed-stages/to-active-provider` (body `{ sessionId, stage, sceneId? }`; 200 `{ moved }`, with the new requested
# duration for a clip; 400 validation; 401; 404 `not-found`; 409 `not-failed`, `already-on-active`, `retry-in-progress`,
# `not-retryable` or `not-usable`). Both are behind the Administrator password. The move binds the stage and sends nothing.
# JOS-223 (report-provider-usage) - 2026-10-22: new `GET /admin/reports/provider-usage?from&to` (ISO 8601 date-times, `[from, to)` on the instant an
# attempt was sent; `from` open when absent, `to` is now when absent; 200 `{ from, to, sceneAttemptsFollowCurrentProvider, rows }` with one row
# per stage and provider: attempts, successes, failures by kind, success rate, median and 95th-percentile latency, billed units and their unit;
# 400 for a bad date-time or `from` not before `to`; 401). Read-only, behind the Administrator password; it carries no key, script, prompt or failure text.
# JOS-200 (show-video-request-status) - 2026-10-26: the scene representation (`POST /sessions`, `GET /sessions/{sessionId}` and `POST .../scenes/{sceneId}/pause` responses, and the live snapshot, which carries the same fields) gains an optional `videoRequest`, present only while a scene's clip request has been sent and is in flight: `provider` (`name`, `model`), `attempt`, `sentAt`, `estimate` (`{ seconds, basedOn }` or null) and `body` (`prompt`, `duration`, `resolution`, `firstFrame`, the scene's image named, never the provider's URL). The clip `stages.video` entry now counts a request in flight.
# JOS-233 (show-clip-task-liveness) - 2026-10-28: `videoRequest` gains three required fields, in every place it appears: `taskId` (the provider's task id of the current attempt, shown on purpose and only here, never inside `body`), `lastCheckedAt` (the last "still running" answer this application received for the task, or null until the first one since it started; held in memory, not stored) and `waitEndsAt` (sentAt + the clip wait ceiling, or null when the video stage has no time limit). Each "still running" answer publishes a fresh snapshot on `/events`.
# JOS-235 (rebuild-scene) - 2026-10-28: new `POST /sessions/{sessionId}/scenes/{sceneId}/rebuild` (body `{ imageInstruction?, videoInstruction? }`, each non-empty after trimming, an omitted one keeps the stored instruction; 202 `{ ok, held }`, 400, 404 `unknown-scene`, 409 `scene-not-ready` or `assembly-in-progress`). It regenerates the scene's image and then its clip on the scene's bound providers, in any session state, and the final video is then rebuilt automatically. `session.finalVideo` gains a required `staleScenes` (a scene was rebuilt after the current version was built). `POST .../final-video/rebuild` also answers 409 `scenes-not-complete`, and accepts a rebuild when `staleScenes` is true. A rebuilt scene's `result.imageUrl` and `downloads.imageUrl` / `downloads.clipUrl` end in `?r={n}` (its rebuild number); the routes ignore the query.
# JOS-228 (record-phase-instants-and-pipeline-report) - 2026-10-26: new `GET /admin/reports/pipeline-time?from&to` (same period rules as the usage report, applied
# to the instant a phase started and, for the attempt counts, the instant an attempt was sent; 200 `{ from, to, phases, sessions }`: per phase the number
# of sessions with a recorded start and end, the median and 95th-percentile seconds, and the attempts that timed out, finished late or were superseded
# (`null` for the scenes phase: scene attempts store no such outcome); per session the seconds of each phase, `null` where no instant was recorded;
# 400 for a bad date-time or `from` not before `to`; 401). Read-only, behind the Administrator password.
# JOS-224 (report-failures-and-retries) - 2026-10-27: new `GET /admin/reports/failures?from&to` (same period rules as the usage report, applied to the instant an
# attempt was sent, or queued for a manual retry never sent; 200 `{ from, to, stages, wordings, failedScenesNow }`: per stage the failed attempts by outcome
# (transient, not-retryable, timed out, the same rows the usage report counts), the retry budgets exhausted and the manual retries (`null` for image and video: scene
# attempts keep no cycles), the five most frequent failure wordings of voice, alignment and reasoning with their counts (never a scene's failure text), and the scenes
# failed now by stage, a state that ignores the period; 400 for a bad date-time or `from` not before `to`; 401). Read-only, behind the Administrator password.
# JOS-225 (report-sessions) - 2026-10-27: new `GET /admin/reports/sessions?from&to` (same period rules as the usage report, applied to the session's creation time;
# 200 `{ from, to, rows }`, newest first: per session the id, title, creation instant, derived state (`final-video-ready`, `failed` with its `failedPhase`, or `in-progress`;
# a recorded failure wins), whether it is paused, its scenes, failed scenes and attempts, and the seconds to the voice-over and to the final video (`null` until they exist);
# 400 for a bad date-time or `from` not before `to`; 401) and `GET /admin/reports/sessions/{sessionId}/scenes` (200 `{ sessionId, rows }` with, per scene, its number, status, image and
# clip provider display names, image and clip request counts, requested duration, speed factor and the two warnings; 401; 404 for an unknown session). Both are read-only, behind the
# Administrator password, and carry no script, prompt, instruction, narration text or failure text: the session title is the only User text.
# JOS-229 (record-provider-changes) - 2026-10-27: new `GET /admin/reports/provider-changes?from&to` (same period rules as the usage report, applied to the instant of the change; 200 `{ from, to, entries }`, newest first: per entry the instant, its kind (`active-provider` or `failed-stage-move`), the stage, the session id and title and the scene number of a move (`null` for an active-provider change), and the previous and new provider ids and display names as logged; 400 for a bad date-time or `from` not before `to`; 401). Read-only, behind the Administrator password; it carries no script, prompt, instruction, narration text or failure text. The log starts empty with migration 25 and holds changes made from then on.
# JOS-227 (report-estimated-cost) - 2026-10-29: new `GET /admin/reports/estimated-cost?from&to` (same period rules as the usage report; 200 `{ from, to, sceneAttemptsFollowCurrentProvider, rows, totals, totalsExcludeUnpriced }`: per stage and provider the display name, unit, billed and failed units, the current price per unit and currency, and the estimated cost, all `null` for an unpriced provider; one total per currency; 400 for a bad date-time or `from` not before `to`; 401). Each `GET /admin/reports/sessions` row gains `estimatedCost` (one `{ currency, estimatedCost }` per currency over all the session's successful attempts on priced providers) and `excludesUnpricedProvider`. Read-only, behind the Administrator password; no key, script, prompt, instruction, narration text or failure text.
# JOS-201 (admin-visual-style-prompt) - 2026-10-19, merged behind the Administrator password 2026-10-22: new GET /admin/settings,
# PUT /admin/settings/visual-style-prompt (`{ visualStylePrompt }`, at most 8,000 characters after trimming, 400 otherwise) and,
# for the optional reference image, PUT (raw bytes, `image/png`, `image/jpeg` or `image/webp`, at most 5 MB: 400 for another
# type or bytes that do not match the type, 413 when too large), GET (the stored bytes, 404 when none) and DELETE (204, also
# when none) on /admin/settings/reference-image. All answer 401 as `/admin/access` without the password. The settings body is
# `visualStylePrompt`, `referenceImage` or null, `updatedAt`; the image's file path is never returned. PUT and DELETE are allowed
# because these are app settings, not session content. The image routes are hand-described because their body is raw bytes.
openapi: 3.0.3
info:
  title: Vid4You API
  version: 0.0.0
  description: Local, single-user API for turning a script into a narrated MP4
    (Vid4You). Generated from the Fastify + Zod route schemas in
    backend/src/routes.ts (docs/backend-standards.md, API and OpenAPI
    Conventions) - never hand-written, to avoid drifting from the real
    validators.
components:
  securitySchemes:
    administratorPassword:
      type: http
      scheme: bearer
      description: The Administrator password (ADMIN_PASSWORD in the local environment
        or secrets file).
  schemas: {}
paths:
  /health:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
                additionalProperties: false
  /languages:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                    label:
                      type: string
                  required:
                    - code
                    - label
                  additionalProperties: false
  /sessions:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Immutable once the session is registered (PRD §4.2).
                script:
                  type: string
                  description: Stored exactly as submitted and immutable from registration onward,
                    in every state (PRD §4.2, D10). No operation modifies it.
                language:
                  type: string
                  enum:
                    - en
                    - es
                  description: Immutable once the session is registered (PRD §4.1, §4.2). One of
                    the configured supported languages (`GET /languages`);
                    English and Spanish by default.
              required:
                - title
                - script
                - language
              additionalProperties: false
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - session
                      sessionId:
                        type: string
                      title:
                        type: string
                        description: Immutable once the session is registered (PRD §4.2).
                      script:
                        type: string
                        description: The script exactly as submitted; immutable from registration
                          onward, in every state (PRD §4.2, D10). No operation
                          modifies it.
                      language:
                        type: string
                        description: Immutable once the session is registered (PRD §4.1, §4.2).
                      state:
                        type: string
                      paused:
                        type: boolean
                      held:
                        type: array
                        items:
                          type: object
                          properties:
                            stage:
                              type: string
                            count:
                              type: number
                          required:
                            - stage
                            - count
                          additionalProperties: false
                        description: Stages with held work; empty when not paused.
                      running:
                        type: array
                        items:
                          type: object
                          properties:
                            stage:
                              type: string
                            count:
                              type: number
                          required:
                            - stage
                            - count
                          additionalProperties: false
                        description: Stages with work actually in flight, computed whether or not the
                          session is paused (JOS-153).
                      failedPhase:
                        type: string
                      failedSceneIndexes:
                        type: array
                        items:
                          type: integer
                        description: 'PRD §8.1: the indexes of the failed scenes, ascending. Present
                          only when failedPhase is "scenes". Derived and
                          read-only.'
                      voiceOver:
                        type: object
                        properties:
                          provider:
                            type: string
                          durationSeconds:
                            type: number
                          nativeTimestampsAvailable:
                            type: boolean
                          completedAt:
                            type: string
                        required:
                          - provider
                          - durationSeconds
                          - nativeTimestampsAvailable
                          - completedAt
                        additionalProperties: false
                        description: Present once the narration exists (PRD §5 step 2). Derived and
                          read-only; the MP3 itself is never offered for
                          download (PRD §12.3).
                      failure:
                        type: object
                        properties:
                          phase:
                            type: string
                          cause:
                            type: string
                          retryable:
                            type: boolean
                          manualRetryAvailable:
                            type: boolean
                            description: Whether the User can start a new cycle of up to four attempts. True
                              only for a retryable failure whose cycle is
                              exhausted.
                          cycle:
                            type: integer
                            minimum: 1
                            description: The cycle that ended in this failure, from 1.
                          attemptsInCycle:
                            type: integer
                            minimum: 1
                            maximum: 4
                            description: Attempts the cycle held when it failed.
                          occurredAt:
                            type: string
                        required:
                          - phase
                          - cause
                          - retryable
                          - manualRetryAvailable
                          - cycle
                          - attemptsInCycle
                          - occurredAt
                        additionalProperties: false
                        description: Present while the session is failed in a phase that records its
                          failure (PRD §8.1); the cause is written for a person.
                      phases:
                        type: array
                        items:
                          type: object
                          properties:
                            phase:
                              type: string
                              enum:
                                - voice-over
                                - decomposition
                                - scenes
                                - assembly
                            status:
                              type: string
                              enum:
                                - pending
                                - in-progress
                                - complete
                                - failed
                              description: "PRD §8.1, §8.3: derived from the session state on every read,
                                never stored."
                            heldCount:
                              type: integer
                              description: Work units a pause is holding for this phase; 0 when not paused.
                            stages:
                              type: array
                              items:
                                type: object
                                properties:
                                  stage:
                                    type: string
                                    enum:
                                      - image
                                      - video
                                      - voice-over
                                      - timestamps
                                      - instructions
                                      - assembly
                                  provider:
                                    type: object
                                    properties:
                                      name:
                                        type: string
                                      model:
                                        type: string
                                        nullable: true
                                    required:
                                      - name
                                      - model
                                    additionalProperties: false
                                  attempts:
                                    type: integer
                                    minimum: 1
                                    description: Attempts recorded for this stage across every retry cycle,
                                      including one still in flight.
                                required:
                                  - stage
                                  - provider
                                  - attempts
                                additionalProperties: false
                              description: "PRD §3: the session-level stages of this phase that have run, in
                                pipeline order, each with its provider and
                                attempt count. Empty for the scenes phase."
                            failure:
                              type: object
                              properties:
                                cause:
                                  type: string
                                retryable:
                                  type: boolean
                              required:
                                - cause
                                - retryable
                              additionalProperties: false
                              description: Present only on a failed voice-over, decomposition or assembly
                                entry. Never carries the failure time, provider
                                detail, credentials or the script. Scene
                                failures are per scene, so the scenes entry has
                                none.
                          required:
                            - phase
                            - status
                            - heldCount
                            - stages
                          additionalProperties: false
