                                attempt count. Empty for the scenes phase."
                            failure:
                              type: object
                              properties:
                                cause:
                                  type: string
                                retryable:
                                  type: boolean
                              required:
                                - cause
                                - retryable
                              additionalProperties: false
                              description: Present only on a failed voice-over, decomposition or assembly
                                entry. Never carries the failure time, provider
                                detail, credentials or the script. Scene
                                failures are per scene, so the scenes entry has
                                none.
                          required:
                            - phase
                            - status
                            - heldCount
                            - stages
                          additionalProperties: false
                        description: "PRD §8.3: always the four phases in pipeline order (voice-over,
