# add-package-smoke-ci (JOS-279): build the smoke flavor of the packaged app on macOS and run one session through the executable.
name: Package smoke

on:
  pull_request:
    branches: [feature/entrega-3-JAME, main]
    paths: ["backend/**", "frontend/**", ".github/workflows/package-smoke.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-smoke:
    runs-on: macos-15 # arm64, the platform `npm run package:smoke` builds
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.4.0 # backend/packaging/targets.ts NODE_VERSION: the single-executable blob needs this exact Node
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: backend
      - run: npm run package:smoke
        working-directory: backend
      - run: npm run package:smoke:run
        working-directory: backend
