# Minimal CI for the MVP (JOS-203 G1, JOS-208, JOS-211): typecheck, lint and unit tests, plus a secrets scan of the commits, on every PR into, and push to, main and the integration branches.
name: CI

on:
  pull_request:
    branches: [feature/entrega-2-JAME, feature/entrega-3-JAME, main]
  push:
    branches: [main, feature/entrega-2-JAME]
  workflow_call: # release.yml reuses this job as the one definition of "the tests pass" (JOS-206)

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # backend runs TypeScript natively (strip-only)
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - if: matrix.package == 'backend'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg # ffprobe validates the voice-over audio
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage # vitest run with the coverage floor of vitest.config.ts (JOS-277)
        env:
          # Tests must never reuse a developer database or a real provider.
          DB_PATH: ${{ runner.temp }}/vid4you-test.db
          PROJECTS_ROOT: ${{ runner.temp }}/vid4you-projects
          USE_STUB_VOICE_PROVIDER: "1"

  # JOS-272, add-browser-e2e: the User's main flow in a real browser, on the real frontend and backend with every provider stubbed.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # backend runs TypeScript natively (strip-only)
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg # ffprobe validates the voice-over audio
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - run: npm test
        working-directory: e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release checksums.txt.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the scan reads every commit of the range
      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan the commits of this change
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # Pull request: its commits. Push: the new commits. New branch or force push: the full history.
          range=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          fi
          # --verbose prints each finding (file, line, rule, commit); --redact keeps the value out of the log.
          gitleaks git --redact --verbose --no-banner ${range:+--log-opts="$range"} .
