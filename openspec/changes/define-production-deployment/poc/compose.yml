# JOS-194 proof of concept — option A host topology (design § Execution Record §5.0).
# backend, caddy and cloudflared share ONE network namespace: the backend listens on 127.0.0.1:3100 only,
# and nothing is published on the host. Secrets come from an env file the host owns, never from the image.
services:
  backend:
    build:
      context: ../../../..
      dockerfile: openspec/changes/define-production-deployment/poc/Dockerfile.a
    image: vid4you-poc-backend
    restart: unless-stopped
    environment:
      POC_MODE: ${POC_MODE:-stub}
      ALLOW_TEST_ENDPOINTS: ${ALLOW_TEST_ENDPOINTS:-1}
    volumes:
      - data:/var/lib/vid4you
  caddy:
    build:
      context: ../../../..
      dockerfile: openspec/changes/define-production-deployment/poc/Dockerfile.web
    image: vid4you-poc-web
    restart: unless-stopped
    network_mode: "service:backend"
  cloudflared:
    image: cloudflare/cloudflared:2025.9.1
    restart: unless-stopped
    network_mode: "service:backend"
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
volumes:
  data:
